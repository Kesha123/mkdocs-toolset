name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine build variables
        id: vars
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx builder
        run: docker buildx create --name ci --driver docker-container --bootstrap --use

      - name: Build and push image
        run: |
          make -C mkdocs publish \
            NAMESPACE=${{ steps.vars.outputs.owner }} \
            BUILD_TAG=${{ inputs.tag }} \
            CACHE="--cache-from type=gha"
